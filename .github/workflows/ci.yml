name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than floating on latest, so a failure here is
          # always reproducible locally.
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The package ships raw TypeScript, so this is the only gate that
      # catches type errors before they reach a consumer.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
