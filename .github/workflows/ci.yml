name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than floating on latest, so a failure here is
          # always reproducible locally.
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The package ships raw TypeScript, so this is the only gate that
      # catches type errors before they reach a consumer.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  changelog:
    name: Changelog updated
    runs-on: ubuntu-latest
    # Load-bearing, not belt-and-braces: the workflow also runs on push to
    # main, where github.base_ref is empty and the diff below would resolve
    # against the literal ref "origin/" and fail.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The check compares against the base branch, which shallow
          # clones do not contain.
          fetch-depth: 0

      # A feat or fix is by definition user-visible, so it belongs in the
      # changelog. Chores, docs, tests and refactors do not. This only
      # catches a missing entry: whether the entry is any good is a
      # judgement no script can make.
      - name: Require a changelog entry for user-visible changes
        run: |
          base="origin/${{ github.base_ref }}"

          visible=$(git log --format='%s' "$base"..HEAD | grep -cE '^(feat|fix)(\(.+\))?!?:' || true)
          touched=$(git diff --name-only "$base"..HEAD | grep -cx 'CHANGELOG.md' || true)

          if [ "$visible" -gt 0 ] && [ "$touched" -eq 0 ]; then
            echo "::error file=CHANGELOG.md::${visible} feat/fix commit(s) since ${base}, but CHANGELOG.md is untouched. Add an entry under ## [Unreleased], or relabel the commits if the change is not user-visible."
            exit 1
          fi

          echo "${visible} user-visible commit(s), CHANGELOG.md touched ${touched} time(s)."
